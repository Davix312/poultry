<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PoultryLink Uganda</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>


<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE: LOGIN FORM -->
        <div class="login-form">

            <h2>Login</h2>
            <p class="subtitle">Welcome back to PoultryLink Uganda</p>

            <form action="#" method="post">

                <div class="input-group">
                    <input type="email" name="email" required>
                    <label>Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">
                    LOGIN
                </button>

                <p class="register-text">
                    Don't have an account?
                    <a href="Register.html">Register</a>
                </p>

                <p class="back-home">
                    <a href="Home.html">← Back to Home</a>
                </p>

            </form>
        </div>

        <!-- RIGHT SIDE: WELCOME MESSAGE -->
        <div class="welcome-panel">

            <div class="welcome-content">
                <h1>WELCOME<br>BACK!</h1>

                <p>
                    PoultryLink Uganda connects poultry farmers
                    with buyers, suppliers and market opportunities.
                </p>

                <p class="welcome-tagline">
                    Growing together, connecting markets.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
